<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="吳宜軒 Stephanie 的作品集｜滿滿Ideas — 廣告企劃、社群與 AI 創意作品。">
<meta property="og:title" content="滿滿Ideas｜Stephanie 的作品集">
<meta property="og:description" content="Hi~ I'm Stephanie! Welcome to... my Brain!">

<title>滿滿Ideas</title>
<style>
@font-face{font-family:"Chiron GoRound TC";src:url("fonts/gr-350N.woff") format("woff");font-weight:100 449;font-display:swap}
@font-face{font-family:"Chiron GoRound TC";src:url("fonts/gr-500M.woff") format("woff");font-weight:450 649;font-display:swap}
@font-face{font-family:"Chiron GoRound TC";src:url("fonts/gr-700B.woff") format("woff");font-weight:650 1000;font-display:swap}
/* Layout: a shop storefront — announcement ticker, sticky store header, hero as "new arrival", a receipt for the why, a product grid of works, order history for experience. */
:root{
  --butter:#FCF0B0; --cream:#F6F3EA; --paper:#FBF9F3;
  --ink:#2E2418; --muted:#76684F; --line:#E9DC9B;
  --accent:#69A2F6; --accent-ink:#FFFFFF; --accent-soft:#D6E6FD; --peach:#FCF0B0; --why-bg:#FCF0B0; --why-ink:#2E2418; --why-pink:#69A2F6; --why-green:#69A2F6; --why-dot:#3E7EE4;
  --shadow:0 1px 0 rgba(43,29,16,.06),0 10px 30px -18px rgba(43,29,16,.35);
  --f-display:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Chiron GoRound TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --butter:#1D1B12; --cream:#27241B; --paper:#2F2B21;
  --ink:#F6F0DA; --muted:#BFB28E; --line:#47402A;
  --accent:#7FB2FF; --accent-ink:#10203A; --accent-soft:#1F3456; --peach:#1D1B12; --why-bg:#1D1B12; --why-ink:#F6F0DA; --why-pink:#7FB2FF; --why-green:#7FB2FF; --why-dot:#4F8FEF;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --butter:#1D1B12; --cream:#27241B; --paper:#2F2B21;
  --ink:#F6F0DA; --muted:#BFB28E; --line:#47402A;
  --accent:#7FB2FF; --accent-ink:#10203A; --accent-soft:#1F3456; --peach:#1D1B12; --why-bg:#1D1B12; --why-ink:#F6F0DA; --why-pink:#7FB2FF; --why-green:#7FB2FF; --why-dot:#4F8FEF;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -18px rgba(0,0,0,.7);
  color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--butter);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;text-rendering:optimizeLegibility;-webkit-font-smoothing:auto}
img,video{image-rendering:auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.1}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
img{display:block}
.wrap{max-width:1200px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* ticker */
.ticker{background:var(--accent);color:var(--accent-ink);overflow:hidden;white-space:nowrap;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em}
.ticker-track{display:inline-flex;gap:48px;padding:8px 0;animation:tick 32s linear infinite}
.ticker-track span::before{content:"✦";margin-right:12px}
@keyframes tick{to{transform:translateX(-50%)}}

/* header */
header.store{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--butter);border-bottom:1.5px solid var(--ink)}
.store-row{display:flex;align-items:center;gap:20px;height:64px}
.logo{font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--accent);text-decoration:none;line-height:1}
.logo{display:flex;align-items:flex-end;gap:4px}
.logo img{height:52px;width:auto;display:block}
.logo .wm{position:relative;display:inline-flex;align-items:flex-end;font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;letter-spacing:-.02em;color:var(--ink);margin-top:14px}
.logo .wm>span{display:inline-block}
.logo .wm .wm-z{position:absolute;left:50%;top:-.5em;font-size:.34em;letter-spacing:.3em;padding-left:.3em;color:var(--accent);transform:translateX(-50%) rotate(3deg);white-space:nowrap}
@media (max-width:600px){.logo .wm{font-size:32px}}
.logo-txt{font-family:var(--f-body);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--ink);line-height:1;padding-bottom:6px;white-space:nowrap}
.logo small{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.1em;margin-left:6px;vertical-align:middle}
nav.links{display:flex;gap:22px;margin-left:auto;font-weight:600;font-size:15px}
nav.links a{color:var(--ink);text-decoration:none;position:relative}
nav.links a:hover{color:var(--accent)}
.cart-btn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.cart-btn:hover{background:var(--ink);color:var(--butter)}
.cart-count{min-width:22px;height:22px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center;padding:0 6px;font-family:var(--f-mono)}
@media (max-width:720px){nav.links{display:none}.cart-btn{margin-left:auto}}

/* hero: one screen — copy + tools on the left, shopping-bag portrait on the right */
.hero{min-height:calc(100svh - 66px);display:grid;align-items:center;padding-block:clamp(20px,3.5svh,44px)}
.hero-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(24px,4vw,56px);align-items:stretch}
.hero-copy{display:flex;flex-direction:column}
.hero-bottom{margin-top:auto;padding-top:clamp(16px,3svh,32px)}
.badge-line:empty{display:none}
.hero-bottom>.tagline{margin-top:0}
.hero-grid>*{min-width:0}
.crumb{color:var(--muted);margin-bottom:clamp(8px,1.6svh,16px)}
.crumb b{color:var(--accent);font-weight:500}
.hi{font-family:var(--f-display);font-weight:700;font-size:clamp(42px,min(6.6vw,10svh),94px);line-height:.98;letter-spacing:-.01em}
.hi .name{color:var(--accent)}
.welcome{margin-top:clamp(8px,1.6svh,16px);font-size:clamp(20px,min(2.6vw,3.8svh),32px);font-weight:800;letter-spacing:-.01em}
.welcome em{font-style:normal;font-family:var(--f-display);font-weight:700;color:var(--accent);padding:0 .1em}
.tagline{margin-top:clamp(10px,2svh,20px);display:grid;gap:2px;font-size:16px;color:var(--muted);max-width:44ch}
.tagline span:first-child{color:var(--ink);font-weight:600}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:clamp(14px,2.6svh,26px)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;border:1.5px solid var(--ink);text-decoration:none;color:var(--ink);background:transparent;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--butter)}

/* portrait: editorial — full-bleed photo, hairline caption, vertical folio note */
.me-wrap{position:relative;margin:0;justify-self:end;width:fit-content;max-width:100%}
.portrait{height:min(calc(100svh - 230px),640px);min-height:380px;aspect-ratio:3/4;max-width:100%;overflow:hidden;border-radius:2px;background:var(--cream)}
.mail-alt{font-size:13px;color:var(--muted);text-align:center;margin-top:-4px}.mail-alt a{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.mail-tip{font-size:12.5px;color:var(--muted);text-align:center;margin-top:-4px}
.photo-adj .pa-wrap{display:flex;gap:14px;align-items:flex-start}
.photo-adj .pa-prev{width:120px;aspect-ratio:3/4;overflow:hidden;flex:none;border-radius:2px;background:var(--cream);border:1px solid var(--line)}
.photo-adj .pa-prev img{width:100%;height:100%;object-fit:cover;display:block}
.photo-adj .pa-ctl{flex:1;display:grid;gap:8px;min-width:0}
.photo-adj .pa-ctl label{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:13px;align-items:center}
.photo-adj .pa-ctl output{justify-self:end;color:var(--muted);font-size:12px}
.photo-adj .pa-ctl input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.photo-adj .pa-ctl button{justify-self:start}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;transition:none}
.me-cap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-top:14px;padding-top:10px;border-top:1px solid var(--ink);font-size:14px;font-weight:500;letter-spacing:.02em}
.me-cap .mono{font-size:10.5px;letter-spacing:.18em;color:var(--muted)}
.side-note{position:absolute;left:-30px;bottom:0;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;letter-spacing:.24em;color:var(--muted);white-space:nowrap}
@media (max-width:860px){
  .hero{min-height:0}
  .hero-grid{grid-template-columns:1fr}
  .me-wrap{justify-self:stretch;width:100%}
  .portrait{height:auto;min-height:0;width:100%}
  .side-note{display:none}
}

/* tools = in the box */
.inbox{margin-top:clamp(14px,2.6svh,24px);display:grid;gap:8px}
.tools-cap{font-size:14px;font-weight:700;color:var(--muted)}
.line2-cap{font-size:16px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:10px 8px}
.tool{display:grid;justify-items:center;gap:4px;width:62px;text-align:center}
.tool .tile{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:19px;border:1.5px solid var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.tool:nth-child(odd) .tile{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:3px 3px 0 var(--ink)}
.tool:hover .tile{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--ink)}
.tool .tile.icon,.tool:nth-child(odd) .tile.icon{background:transparent;border:0;box-shadow:none;padding:0;border-radius:14px;overflow:hidden}
.tool .tile.icon img{width:100%;height:100%;object-fit:contain}
.tool:hover .tile.icon{transform:translateY(-3px);box-shadow:none}
.tool-row .rthumb{width:40px;height:40px;background:var(--paper)}
.tool-row .rthumb img{width:100%;height:100%;object-fit:contain}
.tool small{font-size:11.5px;color:var(--muted);line-height:1.25}
@media (min-width:1100px){.tools{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}.tool{width:auto;min-width:0}.tool .tile{width:min(50px,100%);height:auto;aspect-ratio:1}.tool small{font-size:10.5px;white-space:nowrap}}
.badge-line{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(12px,2svh,20px)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;background:var(--paper)}
.pill.acc{background:var(--accent-soft);border-color:var(--accent)}

/* why */
.why{background:var(--why-bg);color:var(--why-ink);padding-block:clamp(56px,9vw,110px);position:relative;overflow:hidden}
.why .mono{color:var(--why-pink)!important;font-weight:700}
.why h2{color:var(--why-ink)}
.why h2 .q,.why .punch{color:var(--accent)!important;background:none;-webkit-background-clip:border-box;background-clip:border-box}
.why h2 .q{font-family:inherit;font-weight:inherit}
.why .punch{font-style:normal;padding:0}
.why-answer{color:var(--why-ink)!important}
.why-answer b{color:var(--why-ink)}
.why .receipt h4{color:transparent;background:radial-gradient(circle,var(--why-dot) 28%,transparent 31%) 0 0/3px 3px,var(--why-green);-webkit-background-clip:text;background-clip:text}
.why .receipt .tot span:last-child{color:var(--why-green)}
.why .receipt{box-shadow:0 18px 40px -22px rgba(0,0,0,.35)}
.why-stars{position:absolute;inset:0;pointer-events:none;color:var(--why-pink)}
.why-stars span{position:absolute;line-height:1}
.why-stars span:nth-child(1){top:3%;left:3%;font-size:20px;transform:rotate(-12deg)}
.why-stars span:nth-child(2){top:5%;left:24%;font-size:14px;transform:rotate(0deg)}
.why-stars span:nth-child(3){top:2.5%;left:44%;font-size:26px;transform:rotate(14deg)}
.why-stars span:nth-child(4){top:7%;left:63%;font-size:16px;transform:rotate(-6deg)}
.why-stars span:nth-child(5){top:3%;right:20%;font-size:22px;transform:rotate(20deg)}
.why-stars span:nth-child(6){top:6%;right:4%;font-size:30px;transform:rotate(10deg)}
.why-stars span:nth-child(7){top:24%;left:57%;font-size:18px;transform:rotate(-15deg)}
.why-stars span:nth-child(8){top:44%;left:60%;font-size:13px;transform:rotate(25deg)}
.why-stars span:nth-child(9){top:62%;left:56%;font-size:22px;transform:rotate(8deg)}
.why-stars span:nth-child(10){top:30%;right:2%;font-size:16px;transform:rotate(-20deg)}
.why-stars span:nth-child(11){bottom:14%;right:5%;font-size:24px;transform:rotate(12deg)}
.why-stars span:nth-child(12){bottom:4%;left:30%;font-size:22px;transform:rotate(-8deg)}
.why-stars span:nth-child(13){bottom:7%;left:56%;font-size:16px;transform:rotate(18deg)}
.why-stars span:nth-child(14){bottom:3%;right:16%;font-size:28px;transform:rotate(-14deg)}
.why-stars span:nth-child(2),.why-stars span:nth-child(4),.why-stars span:nth-child(8),.why-stars span:nth-child(10),.why-stars span:nth-child(13){display:none}
@media (max-width:860px){.why-stars span:nth-child(n+7):not(:nth-child(12)){display:none}}
.why>.wrap{position:relative;z-index:1}
.why-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:clamp(28px,5vw,72px);align-items:center}
.why-grid>*{min-width:0}
@media (max-width:860px){.why-grid{grid-template-columns:1fr}}
.why .mono{color:var(--accent)}
/* photo background variant */
.why.has-bg{background-color:#5B87A8;background-size:cover;background-position:center 45%;background-repeat:no-repeat;color:#FFF8E6;border-color:transparent}
.why.has-bg::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(20,40,62,.5) 0%,rgba(20,40,62,.25) 45%,rgba(20,40,62,0) 72%);pointer-events:none}
.why.has-bg>.wrap{position:relative}
.why.has-bg .mono{color:#FFD3BC}
.why.has-bg h2,.why.has-bg .why-answer,.why.has-bg .punch{text-shadow:0 2px 20px rgba(12,28,46,.45)}
.why.has-bg .why-answer{color:rgba(255,248,230,.92)}
.why.has-bg .why-answer b{color:#FFF8E6}
.why.has-bg h2 .q,.why.has-bg .punch{color:#9CC3FF}
.why.has-bg .receipt{box-shadow:0 24px 50px -20px rgba(10,18,30,.6)}
.why h2{font-family:var(--f-body);font-weight:900;font-size:clamp(52px,10vw,132px);letter-spacing:-.03em;line-height:1;margin-top:10px}
.why h2 .q{color:var(--accent);font-family:var(--f-display);font-weight:700}
.why-answer{margin-top:clamp(40px,5vw,64px);font-size:clamp(18px,2.2vw,22px);line-height:1.8;max-width:38em;color:color-mix(in srgb,var(--ink) 82%,transparent)}
.why-answer b{color:var(--ink)}
.punch{display:inline-block;margin-top:clamp(6px,1.4vw,16px);margin-left:clamp(90px,22vw,320px);font-family:var(--f-display);font-weight:700;font-size:clamp(110px,15vw,200px);color:var(--accent);line-height:1;transform-origin:50% 80%;animation:shuang 2.6s cubic-bezier(.3,1.6,.5,1) infinite}
@keyframes shuang{0%,58%,100%{transform:rotate(-6deg) scale(1)}64%{transform:rotate(4deg) scale(1.16)}72%{transform:rotate(-10deg) scale(.96)}80%{transform:rotate(-4deg) scale(1.06)}88%{transform:rotate(-7deg) scale(1)}}
.receipt{background:var(--paper);color:var(--ink);font-family:var(--f-mono);font-size:13px;padding:26px 22px 34px;max-width:340px;justify-self:center;width:100%;position:relative;
  -webkit-mask:radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 100%/16px 14px repeat-x,linear-gradient(#000,#000) 0 0/100% calc(100% - 13px) no-repeat;mask:radial-gradient(circle 7px at 50% 100%,transparent 98%,#000) 0 100%/16px 14px repeat-x,linear-gradient(#000,#000) 0 0/100% calc(100% - 13px) no-repeat}
.receipt h4{font-family:var(--f-display);font-weight:700;font-size:24px;text-align:center;margin:0 0 4px;color:var(--accent)}
.receipt .c{text-align:center;color:var(--muted);font-size:11px}
.receipt hr{border:0;border-top:1.5px dashed var(--muted);margin:14px 0}
.receipt .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.receipt .row span:first-child{font-family:var(--f-body);font-size:14px}
.receipt .tot{font-weight:500;font-size:15px}
.receipt .tot span:last-child{color:var(--accent)}
.barcode{height:44px;margin-top:16px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}

/* shop */
.shop{padding-block:clamp(56px,8vw,96px) 0}
html,body{overflow-x:clip}
.shop{position:relative;isolation:isolate}
.shop-ticker{width:100vw;margin-left:calc(50% - 50vw);margin-top:calc(-1 * clamp(56px,8vw,96px));margin-bottom:clamp(16px,2.2vw,26px);color:var(--butter);font-size:clamp(14px,1.6vw,18px);font-weight:700;letter-spacing:.06em}
.shop-ticker .ticker-track{padding:14px 0;gap:56px}
.shop::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background:var(--cream);z-index:-1}
.shop-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:18px;margin-bottom:clamp(20px,3vw,32px);padding-bottom:clamp(12px,1.6vw,18px);border-bottom:1.5px solid var(--ink)}
.shop-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,6vw,72px);color:var(--accent)}
.shop-head p{color:var(--muted);max-width:36ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-block:1.5px solid var(--ink);margin-bottom:28px}
.chip{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--butter)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.6;margin-left:4px}
.toolbar .count{margin-left:auto;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 22px}
.card{display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.card .thumb{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:var(--cream);border:1.5px solid var(--line)}
.card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.card .tagbox{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.tag{background:var(--paper);border:1.5px solid var(--ink);border-radius:6px;padding:1px 8px;font-size:11px;font-weight:700;font-family:var(--f-mono);letter-spacing:.04em}
.tag.hot{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.quick{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);font-size:22px;line-height:1;display:grid;place-items:center;transition:background .15s}
.quick:hover,.quick.in{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card .meta{display:grid;gap:2px}
.card .brand{font-size:12.5px;color:var(--muted);font-weight:600}
.card h3{font-size:17px;font-weight:700;line-height:1.35}

/* once someone touches a video (unmute, pause, seek), keep it on screen: no auto-advance, loop instead of moving on */
["volumechange","pause","seeking"].forEach(ev=>document.addEventListener(ev,e=>{

},true));

function inline(t){ return esc(t).replace(/==(.+?)==/g,"<mark>$1</mark>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function rich(text){

let armed=null;
function rtApply(kind){
  const ta=$("#wk-desc"); if(!ta) return;
  const v=ta.value, a=ta.selectionStart, b=ta.selectionEnd, sel=v.slice(a,b);
  let nv, na, nb;
  if(kind==="mark"||kind==="bold"){
    const m=kind==="mark"?"==":"**"; const txt=sel||"重點文字";
    nv=v.slice(0,a)+m+txt+m+v.slice(b); na=a+m.length; nb=na+txt.length;
  } else {
    const pre={h1:"# ",h2:"## ",li:"- "}[kind];
    const ls=v.lastIndexOf("\n",a-1)+1; let le=v.indexOf("\n",b); if(le<0) le=v.length;
    const block=v.slice(ls,le).split("\n").map(l=>{const c=l.replace(/^(#{1,2}|[-・•])\s+/,""); return l.startsWith(pre)?c:pre+c;}).join("\n");
    nv=v.slice(0,ls)+block+v.slice(le); na=ls; nb=ls+block.length;
  }
  ta.value=nv; ta.focus(); ta.setSelectionRange(na,nb); $("#wk-prev").innerHTML=rich(nv);
}

const EXT_TYPES={jpg:"image/jpeg",jpeg:"image/jpeg",png:"image/png",webp:"image/webp",gif:"image/gif",mp4:"video/mp4",m4v:"video/mp4",webm:"video/webm",mov:"video/mp4",svg:"image/svg+xml"};
function upType(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(ext==="mov"||file.type==="video/quicktime") return "video/mp4";   /* .MOV from iPhone/Mac is served as MP4 */
  if(EXT_TYPES[ext]) return EXT_TYPES[ext];
  return {"image/jpeg":1,"image/png":1,"image/webp":1,"image/gif":1,"video/mp4":1,"video/webm":1}[file.type]?file.type:"";
}
function upStatus(html,kind){ const el=$("#upStatus"); if(!el) return; el.hidden=!html; el.className="upstatus "+(kind||""); el.innerHTML=html||""; }
$("#filePick").addEventListener("change",async e=>{
  const files=[...e.target.files]; e.target.value=""; if(!files.length||!S.db) return;
  if(!S.assets){ upStatus("這個畫面現在無法上傳檔案。請重新整理頁面再試一次。","err"); return; }
  let done=0; const errs=[];
  for(const [n,file] of files.entries()){
    const type=upType(file); const kind=type.startsWith("video")?"video":"image"; const mb=(file.size/1048576).toFixed(1);
    if(!type){ errs.push(`「${esc(file.name)}」格式不支援。圖片請用 JPG／PNG／WebP／GIF，影片請用 MP4／MOV／WebM。`); continue; }
    if((pickFor==="photo"||pickFor==="whybg"||pickFor.startsWith("tool:")||pickFor.startsWith("why:"))&&kind!=="image"){ errs.push("大頭照請選圖片檔。"); continue; }
    if(pickFor.startsWith("reel:")&&kind!=="video"){ errs.push("這裡請選影片檔。"); continue; }
    if(file.size>20*1024*1024){ errs.push(`「${esc(file.name)}」有 ${mb}MB，超過單檔 20MB 上限。可以用 CapCut 匯出 720p 再上傳，或把檔案傳給 Claude 幫你壓縮後放上網站。`); continue; }
    upStatus(`上傳中（${n+1}/${files.length}）：${esc(file.name)}，${mb}MB<br><span class="hint">影片比較大，請稍等，不要關閉視窗。</span>`,"busy");
    try{
      const r=await S.assets.upload(file,{type});
      const ref="asset:"+r.id+":"+kind;
      if(pickFor==="photo"){ await ensureSeeded(); await S.db.doc("site/profile").update({photo:ref}); if(pd) pd.photo=ref; }
      else if(pickFor.startsWith("tool:")) pd.tools[+pickFor.slice(5)].icon=ref;
      else if(pickFor==="whybg") pd.whyBg=ref;
      else if(pickFor.startsWith("why:")){ pd.whyPhotos=[...(pd.whyPhotos||[])]; pd.whyPhotos[+pickFor.slice(4)]=ref; }
      else if(pickFor.startsWith("reel:")) draft.reels[+pickFor.slice(5)].video=ref;
      else draft.images.push(ref);
      done++;
    }catch(err){
      const c=err?.code;
      errs.push(`「${esc(file.name)}」上傳失敗：`+(c==="too_large"?"檔案超過 20MB。":c==="unsupported_type"?"檔案格式不支援。":c==="quota_or_state"?"儲存空間已滿。":c==="rate_limited"?"上傳太頻繁，稍等一下再試。":"請重新整理頁面再試一次。"));
      console.error(err);
    }
  }
  if(done) renderAdmin();
  if(errs.length) upStatus(errs.join("<br>"),"err");
  else upStatus(`已加入 ${done} 個檔案。${pickFor==="photo"?"":(pickFor==="whybg"||pickFor.startsWith("tool:")||pickFor.startsWith("why:"))?"記得按下方「儲存首頁」。":"記得按下方「儲存作品」。"}`,"ok");
});
$("#adminFab").onclick=()=>{ $("#aScrim").hidden=false; renderAdmin(); };

/* ---------- boot ---------- */
renderAll();
(async()=>{
  const cl=window.claude; if(!cl?.use) return;
  const [db,user,assets]=await Promise.all([cl.use("db").catch(()=>null),cl.use("user").catch(()=>null),cl.use("assets").catch(()=>null)]);
  S.assets=assets;
  S.owner = user ? await user.isOwner().catch(()=>false) : false;
  if(S.owner) $("#adminFab").hidden=false;
  if(!db) return;
  S.db=db;
  let remote={works:null,exp:null};
  const apply=()=>{
    if(!S.seeded) return;
    if(remote.works) S.works=remote.works;
    if(remote.exp) S.exp=remote.exp;
    renderAll();
  };
  db.doc("site/profile").onSnapshot(s=>{
    if(s.exists){ const d=s.data(); S.profile={...clone(DEFAULTS.profile),...clone(d)}; S.seeded=!!d.seeded; }
    apply(); renderProfile();
  },()=>{});
  db.collection("works").orderBy("order").onSnapshot(s=>{ remote.works=s.docs.map(d=>({id:d.id,...clone(d.data())})); apply(); },()=>{});
  db.collection("exp").orderBy("order").onSnapshot(s=>{ remote.exp=s.docs.map(d=>({id:d.id,...clone(d.data())})); apply(); },()=>{});
})();

/* 影片保險：有些瀏覽器（如無痕模式）無法直接串流影片檔，改用下載後播放 */
(function(){
  const done=new WeakSet(), cache={};
  function rescue(v){
    if(!v||done.has(v)) return; const u=v.getAttribute("src"); if(!u||u.startsWith("blob:")) return;
    done.add(v);
    const p=cache[u]||(cache[u]=fetch(u,{credentials:"include"}).then(r=>{if(!r.ok) throw r.status; return r.blob();}).then(b=>URL.createObjectURL(new Blob([b],{type:"video/mp4"}))));
    p.then(bu=>{ const t=v.currentTime||0; v.src=bu; try{v.currentTime=t}catch(e){} if(v.autoplay||v.dataset.playing) v.play().catch(()=>{}); }).catch(()=>{ done.delete(v); delete cache[u]; });
  }
  document.addEventListener("error",e=>{ if(e.target&&e.target.tagName==="VIDEO") rescue(e.target); },true);
  function scan(){ document.querySelectorAll("video").forEach(v=>{ if(v.readyState===0 && !done.has(v)){ const r=v.getBoundingClientRect(); if(r.bottom>-800&&r.top<innerHeight+800){ if(!v._t0) v._t0=Date.now(); else if(Date.now()-v._t0>3500) rescue(v); } } }); }
  setInterval(scan,1500);
})();

document.addEventListener("input",e=>{
  if(!["pf-pz","pf-px","pf-py"].includes(e.target.id)) return;
  const q={photoZoom:+$("#pf-pz").value,photoX:+$("#pf-px").value,photoY:+$("#pf-py").value};
  $("#pz-o").textContent=q.photoZoom+"%"; $("#px-o").textContent=q.photoX; $("#py-o").textContent=q.photoY;
  applyPhoto(q); applyPhoto(q,$("#paPrev"));
});
document.addEventListener("click",e=>{
  if(e.target.id!=="pa-reset") return;
  $("#pf-pz").value=100; $("#pf-px").value=50; $("#pf-py").value=28;
  $("#pf-pz").dispatchEvent(new Event("input",{bubbles:true}));
});
